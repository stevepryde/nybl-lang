[package]
name = "nybl-vm"
description = "Bytecode compiler and stack VM for the Nybl programming language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/nybl-vm"
readme = "README.md"
keywords = ["language", "interpreter", "bytecode", "vm"]
categories = ["compilers"]

[lib]
name = "nybl_vm"

# Native ↔ wasm execution-parity harness. CI builds it natively and
# for wasm32-wasip1 (run under wasmtime) and byte-compares the two
# transcripts. Needs std (stdout) and the bundled stdlib, so no_std
# builds skip it.
[[bin]]
name = "wasm_parity"
path = "src/bin/wasm_parity.rs"
required-features = ["std", "nybl-std"]

[dependencies]
nybl = { version = "0.4.2", path = "../nybl", package = "nybl-lang", default-features = false }

[features]
default = ["std", "nybl-std"]
# Keeps std-only host behavior enabled and forwards that choice to nybl-lang.
# When Cargo unifies `std` and `no_std`, `std` takes precedence.
std = ["nybl/std"]
# Forwards to nybl-lang's `no_std` feature — opt in when
# building for bare-metal / edge wasm / embedded targets.
# Use it with default features disabled for a genuine no_std build.
no_std = ["nybl/no_std"]
# Forwards to nybl-lang's `nybl-std` feature — bundles the
# Nybl standard library (`use std.math`, `std.json`, …) at
# build time. On by default so that `nybl_vm::run` with a
# default `NyblHost::resolve_module` path resolves `std.*`
# correctly.
nybl-std = ["nybl/nybl-std"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "embedding"
harness = false
