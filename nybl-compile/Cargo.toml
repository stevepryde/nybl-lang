[package]
name = "nybl-compile"
description = "Ahead-of-time Nybl to Rust source transpiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/nybl-compile"
readme = "README.md"
keywords = ["language", "compiler", "aot", "rust"]
categories = ["compilers"]

[lib]
name = "nybl_compile"

[dependencies]
# AOT transpilation always runs on a std host, so we explicitly
# drop `default-features` only to avoid pulling the `nybl-std`
# stdlib blob when the transpiler doesn't need it. Keep the
# Rust `std` integration explicit.
nybl = { version = "0.4.0", path = "../nybl", package = "nybl-lang", default-features = false, features = ["std"] }

[features]
default = ["nybl-std"]
# Forwards to nybl-lang's `nybl-std` feature. On by default so
# AOT compile pipelines see the bundled stdlib; downstream
# consumers can drop it with `default-features = false` if
# they want nybl-compile without the stdlib source blob.
nybl-std = ["nybl/nybl-std"]

[dev-dependencies]
nybl-vm = { version = "0.4.0", path = "../nybl-vm" }
