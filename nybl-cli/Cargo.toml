[package]
name = "nybl-cli"
description = "CLI and REPL for the Nybl programming language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/nybl-cli"
readme = "README.md"
keywords = ["language", "interpreter", "scripting", "repl"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "nybl"
path = "src/main.rs"

[dependencies]
# The CLI always bundles the stdlib — users running `nybl run`
# or `nybl compile` expect `use std.math` to Just Work.
nybl = { version = "0.4.0", path = "../nybl", package = "nybl-lang", default-features = false, features = ["std", "nybl-std"] }
nybl-sys = { version = "0.4.0", path = "../nybl-sys" }
# The `run` subcommand defaults to the bytecode VM (2–3× faster
# than the tree-walker). `--novm` forces the walker path.
nybl-vm = { version = "0.4.0", path = "../nybl-vm" }
# `nybl compile` emits Rust via the AOT transpiler, then (by
# default) invokes cargo to produce a native binary.
nybl-compile = { version = "0.4.0", path = "../nybl-compile" }
# Compare source and output identities before AOT copy-out. This catches path
# aliases, symlinks, and hard links portably on Unix and Windows.
same-file = "1.0.6"
# Readline-style line editing for the REPL: arrow-key history,
# Ctrl-A/E/K edits, persisted history, and the
# Validator/Completer hooks that drive multi-line input + tab
# completion.
rustyline = { version = "17", features = ["with-file-history"] }
