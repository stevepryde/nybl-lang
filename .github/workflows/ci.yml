name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (std)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Scan tracked text only; the self-test proves a representative
            # tracked Markdown fixture is rejected without matching the guard.
            - run: ./scripts/check-conflict-markers.sh --self-test
            - run: cargo test --all

    bench-smoke:
        name: Bench smoke (embedding)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Criterion's --test mode runs each benchmark body once with
            # no measurement, so the suite can't rot without failing CI.
            - run: cargo bench -p nybl-vm --bench embedding -- --test

    check-no-std:
        name: Check (no-std)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # `--no-default-features`; `--features no_std`
            # pulls in the `libm`-backed math facade so the `f64`
            # builtins still resolve. See `nybl/src/math.rs` for the
            # feature contract.
            - run: cargo check -p nybl-lang --no-default-features --features no_std

    check-wasm:
        name: Check (wasm)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup target add wasm32-unknown-unknown
            - run: cargo check -p nybl-lang --target wasm32-unknown-unknown
            # Same no_std feature requirement on wasm.
            - run: cargo check -p nybl-lang --target wasm32-unknown-unknown --no-default-features --features no_std
            # The VM is embedded on wasm32 by downstream projects
            # (stevegame, nyblcode, nybl-arena) — cover both the
            # default (std) and no_std feature configurations.
            - run: cargo check -p nybl-vm --target wasm32-unknown-unknown
            - run: cargo check -p nybl-vm --target wasm32-unknown-unknown --no-default-features --features no_std
            # nybl-sys is OS-oriented, but it must not compile an
            # unconditional SystemTime::now trap into freestanding wasm.
            - run: cargo check -p nybl-sys --target wasm32-unknown-unknown

    wasm-parity:
        name: Wasm execution parity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Execution parity runs on wasm32-wasip1 rather than
            # wasm32-unknown-unknown because the harness needs stdout;
            # both targets share the wasm32 data layout, and the
            # compile checks above still cover wasm32-unknown-unknown.
            - run: rustup target add wasm32-wasip1
            - uses: bytecodealliance/actions/wasmtime/setup@v1
              with:
                  version: "v27.0.0"
            # Runtime-smoke the nybl-sys clock on freestanding wasm. The
            # exported function returns normally only when unix_time reports
            # the documented Nybl error instead of trapping in SystemTime.
            - run: cargo build -p nybl-wasm-clock-smoke --release --target wasm32-unknown-unknown
            - run: wasmtime run --invoke nybl_sys_clock_smoke target/wasm32-unknown-unknown/release/nybl_wasm_clock_smoke.wasm
            # Run the one curated differential corpus with the engines'
            # default std backend and byte-compare native against WASI.
            - run: cargo run -p nybl-wasm-parity --bin wasm_parity --release > default-native.txt
            - run: cargo build -p nybl-wasm-parity --bin wasm_parity --release --target wasm32-wasip1
            - run: wasmtime target/wasm32-wasip1/release/wasm_parity.wasm > default-wasm.txt
            - run: cmp default-native.txt default-wasm.txt
            # Repeat with both engines built default-features=false + no_std,
            # which selects the same pure-Rust libm backend on both targets.
            - run: cargo run -p nybl-wasm-parity --bin wasm_parity --release --no-default-features --features engine-no-std > no-std-native.txt
            - run: cargo build -p nybl-wasm-parity --bin wasm_parity --release --target wasm32-wasip1 --no-default-features --features engine-no-std
            - run: wasmtime target/wasm32-wasip1/release/wasm_parity.wasm > no-std-wasm.txt
            - run: cmp no-std-native.txt no-std-wasm.txt
            # Negative control: an opt-in target marker must make the same
            # comparison differ, proving the parity check is sensitive.
            - run: cargo run -p nybl-wasm-parity --bin wasm_parity --release --no-default-features --features engine-no-std,divergence-probe > probe-native.txt
            - run: cargo build -p nybl-wasm-parity --bin wasm_parity --release --target wasm32-wasip1 --no-default-features --features engine-no-std,divergence-probe
            - run: wasmtime target/wasm32-wasip1/release/wasm_parity.wasm > probe-wasm.txt
            - name: Verify deliberate divergence is detected
              run: |
                  if cmp -s probe-native.txt probe-wasm.txt; then
                      echo "parity comparison accepted a deliberate divergence"
                      exit 1
                  fi

    check-docs:
        name: Check docs and LLM exports
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: taiki-e/install-action@v2
              with:
                  tool: zola@0.22.1
            - run: bun install --frozen-lockfile
            - run: bun run site:check
