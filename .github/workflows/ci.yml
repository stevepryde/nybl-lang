name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (std)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: cargo test --all

    check-no-std:
        name: Check (no-std)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # `--no-default-features`; `--features no_std`
            # pulls in the `libm`-backed math facade so the `f64`
            # builtins still resolve. See `nybl/src/math.rs` for the
            # feature contract.
            - run: cargo check -p nybl-lang --no-default-features --features no_std

    check-wasm:
        name: Check (wasm)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup target add wasm32-unknown-unknown
            - run: cargo check -p nybl-lang --target wasm32-unknown-unknown
            # Same no_std feature requirement on wasm.
            - run: cargo check -p nybl-lang --target wasm32-unknown-unknown --no-default-features --features no_std
            # The VM is embedded on wasm32 by downstream projects
            # (stevegame, nyblcode, nybl-arena) — cover both the
            # default (std) and no_std feature configurations.
            - run: cargo check -p nybl-vm --target wasm32-unknown-unknown
            - run: cargo check -p nybl-vm --target wasm32-unknown-unknown --no-default-features --features no_std

    wasm-parity:
        name: Wasm execution parity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Execution parity runs on wasm32-wasip1 rather than
            # wasm32-unknown-unknown because the harness needs stdout;
            # both targets share the wasm32 data layout, and the
            # compile checks above still cover wasm32-unknown-unknown.
            - run: rustup target add wasm32-wasip1
            - uses: bytecodealliance/actions/wasmtime/setup@v1
              with:
                  version: "v27.0.0"
            # Run the curated differential corpus natively and under
            # wasmtime, then byte-compare the transcripts. Any
            # difference means Nybl execution drifted between native
            # and wasm (float/libm results, formatting, ordering, …).
            - run: cargo run -p nybl-vm --bin wasm_parity --release > native.txt
            - run: cargo build -p nybl-vm --bin wasm_parity --release --target wasm32-wasip1
            - run: wasmtime target/wasm32-wasip1/release/wasm_parity.wasm > wasm.txt
            - run: cmp native.txt wasm.txt

    check-docs:
        name: Check docs and LLM exports
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: taiki-e/install-action@v2
              with:
                  tool: zola@0.22.1
            - run: bun install --frozen-lockfile
            - run: bun run site:check
